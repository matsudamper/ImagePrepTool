name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test
        run: ./gradlew build --no-daemon

  package-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Package portable Windows app (primary artifact)
        run: .\gradlew.bat packagePortableWindowsExe --no-daemon

      - name: Package installer EXE (optional)
        continue-on-error: true
        run: .\gradlew.bat packageReleaseExe --no-daemon

      - name: Upload installer EXE
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ImagePrepTool-installer-exe
          path: build/compose/binaries/main-release/exe/*.exe
          if-no-files-found: ignore

      - name: Upload portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ImagePrepTool-portable-win
          path: build/compose/binaries/main-release/portable/*.zip

  report-artifacts:
    runs-on: ubuntu-latest
    needs: [build-linux, package-windows-exe]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: Post sticky PR comment (artifacts)
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: imagepreptool-artifacts
          recreate: true
          message: |
            ## ビルド成果物

            | Job | 結果 |
            |-----|------|
            | build-linux | `${{ needs.build-linux.result }}` |
            | package-windows-exe | `${{ needs.package-windows-exe.result }}` |

            Artifacts は [このワークフロー実行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) から取得できます。

            | Artifact | 内容 |
            |----------|------|
            | `ImagePrepTool-portable-win` | ポータブル ZIP（展開後 `ImagePrepTool.exe` を直接起動・JRE 同梱） |
            | `ImagePrepTool-installer-exe` | インストーラ EXE（ビルド成功時のみ） |

            commit: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
