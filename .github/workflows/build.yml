name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test
        run: ./gradlew build --no-daemon

  package-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Package portable Windows app (primary artifact)
        run: .\gradlew.bat :app:packagePortableWindowsExe --no-daemon

      - name: Package installer EXE (optional)
        continue-on-error: true
        run: .\gradlew.bat :app:packageReleaseExe --no-daemon

      - name: Upload installer EXE
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ImagePrepTool-installer-exe
          path: app/build/compose/binaries/main-release/exe/*.exe
          if-no-files-found: ignore

      - name: Upload portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ImagePrepTool-portable-win
          path: app/build/compose/binaries/main-release/portable/*.zip

  report-artifacts:
    runs-on: ubuntu-latest
    needs: [build-linux, package-windows-exe]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: Compose artifact download links
        id: artifact_links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          markdown=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
            --jq 'if (.artifacts | length) == 0 then "" else [.artifacts[] | select(.expired == false) | "- [\(.name)](\(.archive_download_url))"] | join("\n") end')
          if [ -z "$markdown" ]; then
            markdown="（ダウンロード可能な成果物はありません）"
          fi
          {
            echo "message<<EOF"
            echo "$markdown"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky PR comment (artifacts)
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: imagepreptool-artifacts
          recreate: true
          message: ${{ steps.artifact_links.outputs.message }}
