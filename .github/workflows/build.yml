name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: ktlint
        run: ./gradlew ktlintCheck --continue --no-daemon

      - name: detekt
        run: ./gradlew detekt --continue --no-daemon

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Build and test
        run: ./gradlew build --no-daemon

  package-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.name.outputs.artifact_name }}
      portable_artifact_url: ${{ steps.upload_portable.outputs.artifact-url }}
      portable_qr_url: ${{ steps.portable_qr_artifact.outputs.artifact-url }}
      installer_artifact_url: ${{ steps.upload_installer.outputs.artifact-url }}
      s3_url: ${{ steps.upload_s3.outputs.url }}
      s3_qr_url: ${{ steps.s3_qr_artifact.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Package portable Windows app (primary artifact)
        run: .\gradlew.bat :app:packagePortableWindowsExe --no-daemon

      - name: Package installer EXE (optional)
        continue-on-error: true
        run: .\gradlew.bat :app:packageReleaseExe --no-daemon

      - name: Rename portable ZIP with branch and short hash
        id: name
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          # GITHUB_SHA はマージコミットのため、PR 上のコミットと一致する head の SHA を使う
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          SAFE_REPO="${REPOSITORY##*/}"
          SAFE_BRANCH="${BRANCH_NAME//\//-}"
          ARTIFACT_NAME="${SAFE_REPO}-portable-win-${SAFE_BRANCH}-${SHORT_SHA}"
          PORTABLE_DIR="app/build/compose/binaries/main-release/portable"
          SOURCE_ZIP="$(ls "${PORTABLE_DIR}"/*.zip | head -n 1)"
          mv "${SOURCE_ZIP}" "${PORTABLE_DIR}/${ARTIFACT_NAME}.zip"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "PORTABLE_ZIP_PATH=${PORTABLE_DIR}/${ARTIFACT_NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload installer EXE
        id: upload_installer
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ImagePrepTool-installer-exe
          path: app/build/compose/binaries/main-release/exe/*.exe
          if-no-files-found: ignore

      - name: Upload portable ZIP to GitHub Artifacts
        id: upload_portable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ${{ env.PORTABLE_ZIP_PATH }}

      - name: Upload portable ZIP to S3
        id: upload_s3
        if: github.event_name == 'pull_request'
        uses: matsudamper/actions/upload-matsudamper-s3@6f7068834e08294360d6e5987869a5f50c924c66 # v1.0.1
        continue-on-error: true
        with:
          file_path: ${{ env.PORTABLE_ZIP_PATH }}

      - name: Generate QR codes
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GITHUB_URL: ${{ steps.upload_portable.outputs.artifact-url }}
          S3_URL: ${{ steps.upload_s3.outputs.url }}
        run: |
          pip install "qrcode[pil]" --quiet
          python -c "import qrcode, sys; qrcode.make(sys.argv[1]).save('qrcode-github.png')" "${GITHUB_URL}"
          if [ -n "${S3_URL}" ]; then
            python -c "import qrcode, sys; qrcode.make(sys.argv[1]).save('qrcode-s3.png')" "${S3_URL}"
          fi

      - name: Upload GitHub QR artifact
        id: portable_qr_artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-qr-code-github
          path: qrcode-github.png
          archive: false

      - name: Upload S3 QR artifact
        id: s3_qr_artifact
        if: github.event_name == 'pull_request' && steps.upload_s3.outputs.url != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-qr-code-s3
          path: qrcode-s3.png
          archive: false

  report-artifacts:
    runs-on: ubuntu-latest
    needs: [build-linux, package-windows-exe]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: Compose artifact download links
        id: artifact_links
        env:
          ARTIFACT_NAME: ${{ needs.package-windows-exe.outputs.artifact_name }}
          PORTABLE_ARTIFACT_URL: ${{ needs.package-windows-exe.outputs.portable_artifact_url }}
          PORTABLE_QR_URL: ${{ needs.package-windows-exe.outputs.portable_qr_url }}
          INSTALLER_ARTIFACT_URL: ${{ needs.package-windows-exe.outputs.installer_artifact_url }}
          S3_URL: ${{ needs.package-windows-exe.outputs.s3_url }}
          S3_QR_URL: ${{ needs.package-windows-exe.outputs.s3_qr_url }}
          WINDOWS_JOB_RESULT: ${{ needs.package-windows-exe.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -z "$PORTABLE_ARTIFACT_URL" ] || [ "$WINDOWS_JOB_RESULT" != "success" ]; then
            if [ "$WINDOWS_JOB_RESULT" != "success" ]; then
              error_message="❌ 成果物をビルドできませんでした (\`package-windows-exe\`: \`${WINDOWS_JOB_RESULT}\`, [run](${RUN_URL}))"
            else
              error_message="❌ 必須成果物の \`artifact-url\` がありません ([run](${RUN_URL}))"
            fi
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "message<<EOF"
              echo "$error_message"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$S3_URL" ]; then
            s3_row="| ☁️ S3 (portable) | zip | [Download](${S3_URL}) | [View](${S3_QR_URL}) |"
          else
            s3_row="| ☁️ S3 (portable) | - | ⚠️ アップロード失敗 ([run](${RUN_URL})) | - |"
          fi
          installer_row=""
          if [ -n "$INSTALLER_ARTIFACT_URL" ]; then
            installer_row="| 🐙 GitHub Artifacts (installer) | zip | [Download](${INSTALLER_ARTIFACT_URL}) | - |"
          fi

          echo "failed=false" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            echo "✅ Portable build is ready!"
            echo ""
            echo "| Storage | 圧縮方式 | Download Link | QR Code |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| 🐙 GitHub Artifacts (portable) | zip | [Download](${PORTABLE_ARTIFACT_URL}) | [View](${PORTABLE_QR_URL}) |"
            echo "${s3_row}"
            if [ -n "$installer_row" ]; then
              echo "${installer_row}"
            fi
            echo ""
            echo "---"
            echo "*Artifact Name: \`${ARTIFACT_NAME}\`*"
            echo "*Commit: [\`${HEAD_SHA}\`](${COMMIT_URL})*"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky PR comment (artifacts)
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: imagepreptool-artifacts
          recreate: true
          message: ${{ steps.artifact_links.outputs.message }}

      - name: Fail if required artifacts are missing
        if: steps.artifact_links.outputs.failed == 'true'
        run: exit 1
