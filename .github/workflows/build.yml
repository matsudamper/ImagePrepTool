name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: ktlint
        run: ./gradlew ktlintCheck --continue --no-daemon

      - name: detekt
        run: ./gradlew detekt --continue --no-daemon

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build and test
        run: ./gradlew build --no-daemon

  package-windows-exe:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      artifact_name: ${{ steps.name.outputs.artifact_name }}
      installer_artifact_url: ${{ steps.upload_installer.outputs.artifact-url }}
      s3_url: ${{ steps.upload_s3.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Package installer EXE
        env:
          JAVA_TOOL_OPTIONS: -Duser.language=ja -Duser.country=JP
        run: .\gradlew.bat :app:packageReleaseExe --no-daemon

      - name: Print jpackage logs on failure
        if: failure()
        shell: bash
        run: |
          for f in app/build/compose/logs/packageReleaseExe/*.txt; do
            echo "::group::${f}"
            cat "${f}"
            echo "::endgroup::"
          done

      - name: Rename installer EXE with branch and short hash
        id: name
        shell: bash
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          # GITHUB_SHA はマージコミットのため、PR 上のコミットと一致する head の SHA を使う
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          SAFE_REPO="${REPOSITORY##*/}"
          SAFE_BRANCH="$(echo "${BRANCH_NAME}" | sed 's/[^A-Za-z0-9._-]/-/g')"
          ARTIFACT_NAME="${SAFE_REPO}-installer-win-${SAFE_BRANCH}-${SHORT_SHA}"
          INSTALLER_DIR="app/build/compose/binaries/main-release/exe"
          SOURCE_EXE="$(ls "${INSTALLER_DIR}"/*.exe | head -n 1)"
          mv "${SOURCE_EXE}" "${INSTALLER_DIR}/${ARTIFACT_NAME}.exe"
          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "INSTALLER_EXE_PATH=${INSTALLER_DIR}/${ARTIFACT_NAME}.exe" >> "$GITHUB_ENV"

      - name: Upload installer EXE to GitHub Artifacts
        id: upload_installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.name.outputs.artifact_name }}
          path: ${{ env.INSTALLER_EXE_PATH }}

      - name: Upload installer EXE to S3
        id: upload_s3
        if: github.event_name == 'pull_request'
        uses: matsudamper/actions/upload-matsudamper-s3@6f7068834e08294360d6e5987869a5f50c924c66 # v1.0.1
        continue-on-error: true
        with:
          file_path: ${{ env.INSTALLER_EXE_PATH }}

  report-artifacts:
    runs-on: ubuntu-latest
    needs: [build-linux, package-windows-exe]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: Compose artifact download links
        id: artifact_links
        env:
          ARTIFACT_NAME: ${{ needs.package-windows-exe.outputs.artifact_name }}
          INSTALLER_ARTIFACT_URL: ${{ needs.package-windows-exe.outputs.installer_artifact_url }}
          S3_URL: ${{ needs.package-windows-exe.outputs.s3_url }}
          WINDOWS_JOB_RESULT: ${{ needs.package-windows-exe.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [ -z "$INSTALLER_ARTIFACT_URL" ] || [ "$WINDOWS_JOB_RESULT" != "success" ]; then
            if [ "$WINDOWS_JOB_RESULT" != "success" ]; then
              error_message="❌ 成果物をビルドできませんでした (\`package-windows-exe\`: \`${WINDOWS_JOB_RESULT}\`, [run](${RUN_URL}))"
            else
              error_message="❌ 必須成果物の \`artifact-url\` がありません ([run](${RUN_URL}))"
            fi
            echo "failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "message<<EOF"
              echo "$error_message"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$S3_URL" ]; then
            s3_row="| ☁️ S3 (installer) | - | [Download](${S3_URL}) |"
          else
            s3_row="| ☁️ S3 (installer) | - | ⚠️ アップロード失敗 ([run](${RUN_URL})) |"
          fi

          echo "failed=false" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            echo "✅ Installer build is ready!"
            echo ""
            echo "| Storage | 圧縮方式 | Download Link |"
            echo "| :--- | :--- | :--- |"
            echo "| 🐙 GitHub Artifacts (installer) | zip | [Download](${INSTALLER_ARTIFACT_URL}) |"
            echo "${s3_row}"
            echo ""
            echo "---"
            echo "*Artifact Name: \`${ARTIFACT_NAME}\`*"
            echo "*Commit: [\`${HEAD_SHA}\`](${COMMIT_URL})*"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky PR comment (artifacts)
        # 失敗時は投稿せず、前回成功時のコメントを残す
        if: steps.artifact_links.outputs.failed != 'true' && needs.build-linux.result == 'success'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: imagepreptool-artifacts
          recreate: true
          message: ${{ steps.artifact_links.outputs.message }}

      - name: Fail if required artifacts are missing
        if: steps.artifact_links.outputs.failed == 'true'
        run: exit 1
