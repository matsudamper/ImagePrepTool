name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ktlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: ktlint
        run: ./gradlew ktlintCheck --continue --no-daemon

      - name: detekt
        run: ./gradlew detekt --continue --no-daemon

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build and test
        run: ./gradlew build --no-daemon

  package-windows-exe:
    runs-on: windows-latest
    outputs:
      portable_artifact_url: ${{ steps.upload_portable.outputs.artifact-url }}
      installer_artifact_url: ${{ steps.upload_installer.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up JDK 21
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Package portable Windows app (primary artifact)
        run: .\gradlew.bat :app:packagePortableWindowsExe --no-daemon

      - name: Package installer EXE (optional)
        continue-on-error: true
        run: .\gradlew.bat :app:packageReleaseExe --no-daemon

      - name: Upload installer EXE
        id: upload_installer
        if: success() || failure()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ImagePrepTool-installer-exe
          path: app/build/compose/binaries/main-release/exe/*.exe
          if-no-files-found: ignore

      - name: Upload portable ZIP
        id: upload_portable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ImagePrepTool-portable-win
          path: app/build/compose/binaries/main-release/portable/*.zip

  report-artifacts:
    runs-on: ubuntu-latest
    needs: [build-linux, package-windows-exe]
    if: ${{ always() && !cancelled() && github.event_name == 'pull_request' }}
    steps:
      - name: Compose artifact download links
        id: artifact_links
        env:
          PORTABLE_ARTIFACT_URL: ${{ needs.package-windows-exe.outputs.portable_artifact_url }}
          INSTALLER_ARTIFACT_URL: ${{ needs.package-windows-exe.outputs.installer_artifact_url }}
          WINDOWS_JOB_RESULT: ${{ needs.package-windows-exe.result }}
        run: |
          set -euo pipefail
          markdown=""
          if [ -n "$PORTABLE_ARTIFACT_URL" ]; then
            markdown="- [ImagePrepTool-portable-win](${PORTABLE_ARTIFACT_URL})"
          fi
          if [ -n "$INSTALLER_ARTIFACT_URL" ]; then
            if [ -n "$markdown" ]; then
              markdown="${markdown}"$'\n'
            fi
            markdown="${markdown}- [ImagePrepTool-installer-exe](${INSTALLER_ARTIFACT_URL})"
          fi

          if [ -n "$markdown" ] && [ -n "$PORTABLE_ARTIFACT_URL" ]; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
            {
              echo "message<<EOF"
              echo "$markdown"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$WINDOWS_JOB_RESULT" != "success" ]; then
            error_message="**エラー:** 成果物をビルドできませんでした（\`package-windows-exe\`: \`${WINDOWS_JOB_RESULT}\`）"
          else
            error_message="**エラー:** 必須成果物 \`ImagePrepTool-portable-win\` の \`artifact-url\` がありません"
          fi

          echo "failed=true" >> "$GITHUB_OUTPUT"
          {
            echo "message<<EOF"
            echo "$error_message"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Post sticky PR comment (artifacts)
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: imagepreptool-artifacts
          recreate: true
          message: ${{ steps.artifact_links.outputs.message }}

      - name: Fail if required artifacts are missing
        if: steps.artifact_links.outputs.failed == 'true'
        run: exit 1
