name: Build

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

  package-windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package standalone Windows EXE (installer + portable)
        run: >
          .\gradlew.bat
          packageReleaseExe
          packagePortableWindowsExe
          --no-daemon

      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: ImagePrepTool-installer-exe
          path: build/compose/binaries/main-release/exe/*.exe

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ImagePrepTool-portable-win
          path: build/compose/binaries/main-release/portable/*.zip

  report-artifacts:
    runs-on: ubuntu-latest
    needs: [build-linux, package-windows-exe]
    if: github.event_name == 'pull_request'
    steps:
      - name: Post sticky PR comment (artifacts)
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: imagepreptool-artifacts
          recreate: true
          message: |
            ## ビルド成果物

            | Job | 結果 |
            |-----|------|
            | build-linux | `${{ needs.build-linux.result }}` |
            | package-windows-exe | `${{ needs.package-windows-exe.result }}` |

            Windows パッケージが成功した場合、以下の Artifacts を [このワークフロー実行](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) からダウンロードできます。

            | Artifact | 内容 |
            |----------|------|
            | `ImagePrepTool-installer-exe` | JRE 同梱インストーラ EXE（`packageReleaseExe`） |
            | `ImagePrepTool-portable-win` | ポータブル ZIP（展開後 `ImagePrepTool.exe` を直接起動） |

            commit: [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
